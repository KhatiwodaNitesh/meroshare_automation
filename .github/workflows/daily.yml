name: Daily MeroShare Automation

on:
  schedule:
    - cron: '15 7 * * *'  # Runs daily at 1:00 PM Nepal Time (UTC+5:45)
  workflow_dispatch:
    inputs:
      user_ids:
        description: 'Comma-separated user IDs to run, for example bhagawoti,nitesh. Leave blank to run all configured secrets.'
        required: false
        type: string

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run MeroShare automation
        env:
          URL: ${{ secrets.URL }}
          BHAGAWOTI_ENV: ${{ secrets.BHAGAWOTI_ENV }}
          KHILA_ENV: ${{ secrets.KHILA_ENV }}
          NABIN_ENV: ${{ secrets.NABIN_ENV }}
          NISHA_ENV: ${{ secrets.NISHA_ENV }}
          NITESH_ENV: ${{ secrets.NITESH_ENV }}
          USER_IDS: ${{ github.event.inputs.user_ids || '' }}
        run: npm run test:ci:multi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
